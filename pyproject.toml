[project]
name = "fpga-devmind"
version = "0.0.1"
description = "FPGA development understanding agent prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]

[project.scripts]
fpga-devmind = "fpga_devmind.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
